name: techstore

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: techstore
      MYSQL_ROOT_PASSWORD: Ee668692eE
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pEe668692eE"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: TechStore
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: techstore
      DB_USERNAME: root
      DB_PASSWORD: Ee668692eE
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "cp -n .env.example .env || true &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mysql_data:
